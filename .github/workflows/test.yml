name: Tests

# The auth contract is shared by every Octopus service, so a regression here is a
# regression everywhere. Run on every push, not just on release tags.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm test
